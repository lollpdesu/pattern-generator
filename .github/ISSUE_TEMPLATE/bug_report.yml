name: Bug report
description: Something doesn't work or looks wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more precisely you describe it, the faster it can be fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. What did you expect instead?
      placeholder: When I turn on Seamless BOTH with the Hexagon pattern, the cells at the right edge don't line up…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick the Hexagon pattern
        2. Set the canvas to 100 × 100 mm
        3. Turn on Seamless → BOTH
        4. …
    validations:
      required: true
  - type: dropdown
    id: pattern
    attributes:
      label: Pattern
      options:
        - Voronoi
        - Delaunay
        - Polygon
        - Hexagon
        - Squares / Diamonds
        - Brick
        - Random tiles
        - Dots
        - Triangles
        - Flower
        - Arcs
        - Al Bahar façade
        - Not pattern-specific
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Canvas / preview
        - Seamless tiling
        - SVG export
        - PNG export
        - Presets / projects
        - Controls / sidebar
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 131 on Windows 11
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded, e.g. v1.0.0
      placeholder: v1.0.0
  - type: textarea
    id: files
    attributes:
      label: Screenshots or project file
      description: Drag in a screenshot, or attach your project JSON (EXPORT tab → PROJECT → Save JSON) so the problem can be reproduced exactly.
